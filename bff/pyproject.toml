[project]
name = "aihub-bff"
version = "0.1.0"
description = "AI Hub Backend-for-Frontend: Entra ID OIDC, server-side sessions, Apigee proxy, SPA host"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "authlib>=1.3",
    "pyjwt[crypto]>=2.9",
    "cryptography>=43.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "google-auth>=2.35",
    "google-cloud-firestore>=2.19",
    "google-cloud-kms>=3.0",
    "google-cloud-secret-manager>=2.21",
    "google-cloud-storage>=2.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    # Upper-bounded on purpose: `ruff format --check` gates CI, and the
    # formatter's output changes between minor releases, so an unpinned ruff
    # turns an unrelated upstream release into a red pipeline.
    "ruff>=0.16,<0.17",
    "mypy>=1.13",
    "types-requests",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "C4", "RET", "SIM"]
ignore = [
    "S104", # binding to 0.0.0.0 is required by Cloud Run
    "B008", # FastAPI Depends() in defaults is the documented pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
# config.py holds Secret Manager secret *names*, not secret values (gap G15).
"app/config.py" = ["S105"]
# Verbatim fixture text ported from src/mocks/mockReports.ts. Reflowing it would
# change the bytes the frontend snapshot-tests against.
"app/proxy/mock/reports.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
plugins = []

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:app.*"]
