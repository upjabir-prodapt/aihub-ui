<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>On-Demand NaaS 2.0</title>
    <script>
      // Set the theme before first paint (not in React) so a returning
      // dark-mode user doesn't see a flash of the light theme while the
      // app boots — see src/theme/ThemeContext.tsx for the same key/logic.
      (function () {
        var stored = localStorage.getItem('naas-theme');
        var theme =
          stored === 'light' || stored === 'dark'
            ? stored
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
