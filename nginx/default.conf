server {
    listen 8080;
    server_name localhost;

    # Browser: fetch identity token with chosen audience (query param)
    location /api/metadata/id-token {
        proxy_pass http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/identity$is_args$args;
        proxy_set_header Metadata-Flavor Google;
    }

    # UI runtime SA → Translation API invoker token (audience = translationConfig.ts)
    location = /_cloud_run_identity_translation {
        internal;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Metadata-Flavor Google;
        proxy_pass http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/identity?audience=https://translation-api-service-297743845367.europe-west1.run.app;
    }

    # UI runtime SA → Sales API invoker token (audience = salesConfig.ts)
    location = /_cloud_run_identity_sales {
        internal;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Metadata-Flavor Google;
        proxy_pass http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/identity?audience=https://sales-research-application-297743845367.europe-west1.run.app;
    }

    location /api/v1/ {
        auth_request /_cloud_run_identity_translation;
        auth_request_set $translation_google_id_token $upstream_response_body;

        proxy_pass https://translation.aicoesandox-int.colt.net/api/v1/;
        proxy_ssl_server_name on;
        proxy_ssl_trusted_certificate /etc/nginx/certs/colt-internal-ca.pem;
        proxy_ssl_verify on;
        proxy_set_header Host translation.aicoesandox-int.colt.net;
        proxy_set_header Authorization "Bearer $translation_google_id_token";
        proxy_set_header X-Serverless-Authorization "Bearer $translation_google_id_token";
        proxy_set_header x-app-auth $http_x_app_auth;
    }

    location /api/sales/v1/ {
        auth_request /_cloud_run_identity_sales;
        auth_request_set $sales_google_id_token $upstream_response_body;

        proxy_pass https://salesagent.aicoesandox-int.colt.net/api/v1/;
        proxy_ssl_server_name on;
        proxy_ssl_trusted_certificate /etc/nginx/certs/colt-internal-ca.pem;
        proxy_ssl_verify on;
        proxy_set_header Host salesagent.aicoesandox-int.colt.net;
        proxy_set_header Authorization "Bearer $sales_google_id_token";
        proxy_set_header X-Serverless-Authorization "Bearer $sales_google_id_token";
        proxy_set_header x-app-auth $http_x_app_auth;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}
